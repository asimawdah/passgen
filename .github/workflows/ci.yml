name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Validate CLI syntax
        run: node --check index.js

      - name: Run CLI smoke tests
        run: |
          set -o pipefail
          node test.js 2>&1 | tee cli-smoke-test.log

      - name: Upload CLI smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-test-node-${{ matrix.node-version }}
          path: cli-smoke-test.log
          if-no-files-found: ignore

      - name: Run validation contract checks
        run: node test-validation-contract.js

      - name: Run review checklist checks
        run: node test-cli-review-checklist.js
